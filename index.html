<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0F2237">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: blob:; media-src blob: data:; connect-src https://api.openai.com https://generativelanguage.googleapis.com https://api.anthropic.com https://eutils.ncbi.nlm.nih.gov https://api.openalex.org https://www.ebi.ac.uk https://api.unpaywall.org; worker-src blob: https://cdnjs.cloudflare.com; base-uri 'none'; form-action 'none'">
<meta name="author" content="Fernando Borrás Rocher">
<meta name="description" content="Revisión sistemática con tres revisores de IA de proveedores distintos">
<title>PRISMIA · Revisión sistemática con tres revisores de IA de proveedores distintos</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --tinta:#0F2237; --acero:#2E4B6B; --acero-claro:#7C93AC; --gris:#5D7691;
  --papel:#F3F6FA; --blanco:#FFFFFF; --linea:#D8E0E9; --linea-2:#E8EEF4;
  --brasa:#E4572E; --brasa-osc:#C9441F; --brasa-suave:#FDEBE4;
  --forjado:#0E7C6B; --forjado-suave:#E0F3EE; --aviso:#8A3617;
  --c-ctx:#1F6FB2; --c-comp:#6B4FD8; --c-rda:#0E8C7A; --c-tema:#C98200; --c-eval:#E4572E; --c-final:#2E4B6B;
  --sombra:0 1px 0 rgba(15,34,55,.05), 0 14px 34px -22px rgba(15,34,55,.45);
  --sombra-alta:0 2px 0 rgba(15,34,55,.04), 0 22px 50px -24px rgba(15,34,55,.55);
  --r:14px;
  --display:"Bricolage Grotesque",Georgia,serif;
  --texto:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--papel);color:var(--tinta);font-family:var(--texto);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:84px}
a{color:var(--acero)}
:focus-visible{outline:3px solid var(--brasa);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
svg.i{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
code{font-family:var(--mono);font-size:.85em;background:var(--linea-2);padding:1px 5px;border-radius:5px}

/* Barra superior */
.topbar{position:sticky;top:0;z-index:40;background:var(--tinta);color:#EAF1F7;box-shadow:0 6px 24px -14px rgba(0,0,0,.6)}
.tb-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.logo{background:none;border:0;color:#fff;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.03em;cursor:pointer;padding:2px 4px;display:flex;align-items:center;gap:8px}
.logo em{font-style:normal;color:var(--brasa)}
.logo .anv{width:30px;height:30px;border-radius:9px;background:var(--brasa);display:grid;place-items:center;color:#fff}
.stepper{flex:1;display:flex;align-items:center;justify-content:center;min-width:0}
.sdot{display:flex;align-items:center;gap:7px;background:none;border:0;color:#8FA7BE;font:600 13px var(--texto);padding:6px;cursor:pointer;border-radius:10px;white-space:nowrap}
.sdot:disabled{cursor:not-allowed;opacity:.45}
.sdot .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid #3E5C7D;font-size:12px;color:#A9C0D4;transition:all .2s}
.sdot .n svg{width:14px;height:14px}
.sdot[data-state="done"] .n{background:var(--forjado);border-color:var(--forjado);color:#fff}
.sdot[data-state="now"]{color:#fff}
.sdot[data-state="now"] .n{background:var(--brasa);border-color:var(--brasa);color:#fff;box-shadow:0 0 0 4px rgba(228,87,46,.25)}
.sdot:not(:disabled):hover{background:rgba(255,255,255,.06)}
.sline{flex:0 1 26px;height:2px;background:#2F4A68;min-width:6px}
.sline.on{background:var(--forjado)}
.tb-tools{display:flex;gap:6px}
.tb-btn{background:transparent;border:1px solid #3E5C7D;color:#C9D8E6;border-radius:9px;padding:6px 10px;font:600 13px var(--texto);cursor:pointer;display:flex;align-items:center;gap:6px}
.tb-btn:hover{border-color:var(--brasa);color:#fff}
.progress{height:4px;background:#1E3550}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brasa),#F59E0B);transition:width .4s}
@media(max-width:960px){.sdot .lbl{display:none}.sdot[data-state="now"] .lbl{display:inline}}
@media(max-width:720px){
  .tb-in{flex-wrap:wrap;gap:8px}
  .stepper{order:3;flex-basis:100%;justify-content:space-between}
  .sdot[data-state="now"] .lbl{display:none}
  .tb-btn .lbl{display:none}
}

/* Pantallas */
main{max-width:1180px;margin:0 auto;padding:26px 16px 40px}
.screen{display:none}
.screen.on{display:block}
@media(prefers-reduced-motion:no-preference){.screen.on{animation:rise .35s cubic-bezier(.2,.7,.3,1) both}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}}
.sh{display:flex;gap:18px;align-items:flex-start;margin:4px 0 22px}
.sh-ico{width:64px;height:64px;border-radius:18px;background:var(--c,var(--brasa));color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 12px 24px -14px var(--c,var(--brasa))}
.sh-ico svg{width:32px;height:32px}
.sh-step{font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acero-claro);margin:4px 0}
.sh h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,3.6vw,38px);letter-spacing:-.025em;line-height:1.05;margin:0 0 6px}
.sh-lede{margin:0;color:var(--gris);font-size:16.5px;max-width:70ch}
@media(max-width:600px){.sh-ico{width:48px;height:48px;border-radius:14px}.sh-ico svg{width:24px;height:24px}}

.card{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r);box-shadow:var(--sombra);padding:20px;margin-bottom:18px}
.card h3{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em;margin:0 0 4px;display:flex;align-items:center;gap:9px}
.card h3 .num{width:26px;height:26px;border-radius:8px;background:var(--tinta);color:#fff;font:700 13px var(--mono);display:grid;place-items:center}
.card .sub{margin:0 0 14px;color:var(--gris);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:start}
.sticky{position:sticky;top:96px}
@media(max-width:900px){.cols{grid-template-columns:1fr}.sticky{position:static}}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}

label,.lab{display:block;font-size:13.5px;font-weight:600;margin:0 0 6px;color:var(--acero)}
label small,.lab small{font-weight:500;color:var(--acero-claro)}
input[type=text],input[type=password],input[type=number],textarea,select{width:100%;padding:11px 13px;border:1.5px solid var(--linea);border-radius:10px;font-family:var(--texto);font-size:15px;color:var(--tinta);background:#fff;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acero-claro);box-shadow:0 0 0 4px rgba(124,147,172,.18)}
input.bad{border-color:var(--brasa);box-shadow:0 0 0 4px rgba(228,87,46,.15)}
textarea{resize:vertical;min-height:96px;line-height:1.5}
input::placeholder,textarea::placeholder{color:#9DB0C2}
.field{margin-bottom:16px}
.help{font-size:12.8px;color:var(--gris);margin:6px 0 0}
.help b{color:var(--acero)}

button{font-family:var(--texto);cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:11px;font-weight:600;font-size:15px;border:1.5px solid transparent;padding:11px 18px;transition:transform .08s,background .15s,border-color .15s;text-decoration:none;line-height:1.2}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brasa);color:#fff;box-shadow:0 8px 18px -10px var(--brasa)}
.btn-primary:hover{background:var(--brasa-osc)}
.btn-big{font-size:17px;padding:14px 24px;border-radius:13px}
.btn-dark{background:var(--tinta);color:#fff}
.btn-dark:hover{background:#1c3656}
.btn-ghost{background:#fff;border-color:var(--linea);color:var(--acero)}
.btn-ghost:hover{border-color:var(--acero-claro);background:#F7FAFC}
.btn-ok{background:var(--forjado);color:#fff}
.btn-ok:hover{background:#0b6457}
.btn-word{background:#2B579A;color:#fff}
.btn-word:hover{background:#1e3f7a}
.btn-sm{padding:7px 12px;font-size:13.5px;border-radius:9px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#fff;border:1.5px solid var(--linea);border-radius:999px;padding:7px 13px;font-size:13.5px;color:var(--acero);cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.25;text-align:left}
.chip:hover{border-color:var(--brasa);color:var(--brasa)}
.chip[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:#fff}
.chip.mini-ex{font-size:12.5px;padding:4px 10px;border-style:dashed}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--linea);background:#fff;border-radius:9px;padding:7px 11px;font-size:13.5px;font-weight:600;color:var(--acero)}
.seg button:hover{border-color:var(--acero-claro)}
.seg button[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:#fff}

.meto{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.meto button{text-align:left;background:#fff;border:1.5px solid var(--linea);border-radius:12px;padding:10px 12px;color:var(--tinta)}
.meto button b{display:block;font-size:14px}
.meto button span{display:block;font-size:12.3px;color:var(--gris);line-height:1.35;margin-top:2px}
.meto button:hover{border-color:var(--acero-claro)}
.meto button[aria-pressed="true"]{border-color:var(--tinta);box-shadow:0 0 0 2px var(--tinta);background:var(--papel)}

.tip{display:flex;gap:12px;background:#FFF8E6;border:1px solid #F3DDA0;border-radius:12px;padding:13px 15px;font-size:14px;color:#6B4E00;margin-bottom:18px}
.tip svg{width:22px;height:22px;color:#C98200;flex:none;margin-top:1px}
.tip strong{color:#523B00}
.aviso{background:var(--brasa-suave);border:1px solid #F3C7B5;border-radius:12px;padding:13px 15px;font-size:14px;color:var(--aviso);margin-bottom:16px}
.okbox{background:var(--forjado-suave);border:1px solid #A9DCCF;border-radius:12px;padding:13px 15px;font-size:14px;color:#0B5A4E;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* Inicio */
.hero{background:var(--tinta);color:#EAF1F7;border-radius:22px;padding:40px 36px;position:relative;overflow:hidden;margin-bottom:26px;box-shadow:var(--sombra-alta)}
.hero::before{content:"";position:absolute;right:-80px;top:-80px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(228,87,46,.55),transparent 65%)}
.hero::after{content:"";position:absolute;left:30%;bottom:-140px;width:420px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(14,140,122,.35),transparent 65%)}
.hero>*{position:relative;z-index:1}
@media(max-width:600px){.hero{padding:28px 20px;border-radius:18px}}
.eyebrow{font:600 11.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#8FA7BE;margin:0 0 14px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,5.4vw,58px);line-height:.98;letter-spacing:-.035em;margin:0 0 16px;max-width:17ch}
.hero h1 em{font-style:normal;color:var(--brasa)}
.hero p.lede{max-width:62ch;font-size:18px;color:#C3D3E2;margin:0 0 24px}
.hero .actions .btn-ghost{background:transparent;color:#fff;border-color:#4A6787}
.hero .actions .btn-ghost:hover{border-color:#fff}
.draft{margin-top:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14.5px}
.sec-title{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;margin:34px 0 6px}
.sec-sub{color:var(--gris);margin:0 0 16px}
.journey{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.jstop{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:16px;position:relative}
.jstop .ji{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--c);margin-bottom:10px}
.jstop .ji svg{width:20px;height:20px}
.jstop b{display:block;font-size:15px;margin-bottom:2px}
.jstop span{display:block;font-size:13px;color:var(--gris);line-height:1.45}
.jstop .jn{position:absolute;top:12px;right:14px;font:700 12px var(--mono);color:var(--acero-claro)}
@media(max-width:900px){.journey{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.journey{grid-template-columns:1fr}}

.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.part{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--linea);border-radius:12px;padding:12px 14px}
.part .pi{width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);display:grid;place-items:center;flex:none}
.part b{display:block;font-size:14.5px}
.part span{display:block;font-size:12.8px;color:var(--gris);line-height:1.4}

.examples{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.excard{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--sombra);position:relative;overflow:hidden;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s}
.excard:hover{transform:translateY(-3px);box-shadow:var(--sombra-alta)}
.excard::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--c)}
.excard .emo{font-size:32px;line-height:1}
.excard .area{font:700 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--acero-claro)}
.excard b{font-family:var(--display);font-size:18px;letter-spacing:-.01em;line-height:1.15}
.excard p{margin:0;font-size:13.5px;color:var(--gris);flex:1}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);border-radius:999px;padding:3px 9px;align-self:flex-start}

/* Clave */
.keyrow{display:flex;gap:8px}
.keyrow input{flex:1;font-family:var(--mono);font-size:14px}
.eye{width:46px;flex:none;border:1.5px solid var(--linea);background:#fff;border-radius:10px;color:var(--acero);display:grid;place-items:center}
.light{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--papel);margin-top:14px;font-size:14.5px;font-weight:600}
.light .bulbo{width:14px;height:14px;border-radius:50%;background:#B8C5D3;box-shadow:0 0 0 4px rgba(184,197,211,.3);flex:none}
.light[data-s="ok"] .bulbo{background:#16A34A;box-shadow:0 0 0 4px rgba(22,163,74,.22)}
.light[data-s="err"] .bulbo{background:var(--brasa);box-shadow:0 0 0 4px rgba(228,87,46,.22)}
.light[data-s="wait"] .bulbo{background:#F59E0B;box-shadow:0 0 0 4px rgba(245,158,11,.25)}
.olsteps{list-style:none;padding:0;margin:0;counter-reset:o;display:flex;flex-direction:column;gap:12px}
.olsteps li{counter-increment:o;display:flex;gap:12px;font-size:14.5px;align-items:flex-start}
.olsteps li::before{content:counter(o);width:28px;height:28px;border-radius:50%;background:var(--brasa-suave);color:var(--brasa);font:700 13px var(--mono);display:grid;place-items:center;flex:none}

/* Acordeones */
.acc{background:#fff;border:1px solid var(--linea);border-radius:var(--r);margin-bottom:12px;box-shadow:var(--sombra);overflow:hidden}
.acc>summary{list-style:none;cursor:pointer;padding:15px 18px;display:flex;align-items:center;gap:12px}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary .ai{width:36px;height:36px;border-radius:10px;background:var(--papel);color:var(--acero);display:grid;place-items:center;flex:none}
.acc[open]>summary .ai{background:var(--tinta);color:#fff}
.acc>summary b{font-family:var(--display);font-size:17px;display:block}
.acc>summary small{display:block;color:var(--gris);font-size:13px}
.acc>summary .chev{margin-left:auto;transition:transform .2s;color:var(--acero-claro)}
.acc[open]>summary .chev{transform:rotate(180deg)}
.acc .inner{padding:4px 18px 18px;border-top:1px solid var(--linea-2)}
.acc .inner>*:first-child{margin-top:14px}
.prompt-ta{font-family:var(--mono);font-size:12.3px;min-height:130px;background:#FBFDFE}

/* Resumen lateral */
.sum h3{margin-bottom:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.stat{background:var(--papel);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:800 24px var(--display);letter-spacing:-.02em;line-height:1.1}
.stat span{font-size:12.3px;color:var(--gris)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.checks li{display:flex;gap:9px;align-items:center;color:var(--gris)}
.checks li .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--linea);display:grid;place-items:center;flex:none}
.checks li.on{color:var(--tinta)}
.checks li.on .ck{background:var(--forjado);border-color:var(--forjado);color:#fff}
.checks li .ck svg{width:12px;height:12px}
.docname{margin-top:14px;padding:11px 13px;border-radius:11px;background:var(--tinta);color:#C3D3E2;font-size:13.5px}
.docname b{color:#fff}

/* Generación */
.agents{display:flex;flex-direction:column;gap:10px}
.agent{background:#fff;border:1px solid var(--linea);border-radius:var(--r);box-shadow:var(--sombra);overflow:hidden;transition:border-color .2s}
.agent-h{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.agent .ai{width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);display:grid;place-items:center;flex:none;transition:all .2s}
.agent .ai svg{width:20px;height:20px}
.agent-t{flex:1;min-width:0}
.agent-t b{display:block;font-family:var(--display);font-size:16.5px}
.agent-t span{display:block;font-size:13px;color:var(--gris)}
.pill{font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--linea-2);color:var(--gris);white-space:nowrap}
.agent[data-s="run"]{border-color:#F59E0B}
.agent[data-s="run"] .ai{background:var(--c);color:#fff;animation:pulse 1s infinite alternate}
.agent[data-s="run"] .pill{background:#FFF1D6;color:#8A5A00}
.agent[data-s="ok"] .ai{background:var(--c);color:#fff}
.agent[data-s="ok"] .pill{background:var(--forjado-suave);color:var(--forjado)}
.agent[data-s="err"]{border-color:var(--brasa)}
.agent[data-s="err"] .pill{background:var(--brasa-suave);color:var(--brasa)}
.agent-b{display:none;padding:4px 18px 16px 72px;font-size:14px;border-top:1px solid var(--linea-2);background:#FBFDFE}
.agent.open .agent-b{display:block}
@media(max-width:600px){.agent-b{padding-left:18px}}
@keyframes pulse{from{transform:scale(1);box-shadow:0 0 0 0 rgba(228,87,46,.5)}to{transform:scale(1.06);box-shadow:0 0 0 10px rgba(228,87,46,0)}}
.forging{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;background:var(--tinta);color:#fff;margin-bottom:16px}
.forging .spark{width:44px;height:44px;border-radius:12px;background:var(--brasa);display:grid;place-items:center;flex:none;animation:pulse 1s infinite alternate}
.forging.done .spark{background:var(--forjado);animation:none}
.forging.err .spark{animation:none}

<script>const APP="prismia";const APP_NAME="PRISMIA";const LOGO_ICON="users";
"use strict";
/* ── utilidades comunes (todas las apps Forja) ──────────────────────────────
   Requiere que la app defina antes:  const APP = 'miapp';  (prefijo de almacenamiento)  */
const $ = id => document.getElementById(id), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ico = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = (p = '') => p + Math.random().toString(36).slice(2, 8);
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
const wc = s => (String(s || '').trim().match(/[\p{L}\p{N}]+/gu) || []).length;
const chunk = (a, n) => { const o = []; for (let i = 0; i < a.length; i += n) o.push(a.slice(i, i + n)); return o; };
const nf = n => Math.round(n).toLocaleString('es-ES');
const mmss = s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
const slug = s => norm(s).replace(/ /g, '_').slice(0, 40) || 'x';
function toast(m, ms = 4200) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms); }
function dl(nombre, contenido, tipo) { const b = contenido instanceof Blob ? contenido : new Blob([contenido], {type: tipo}); const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href = u; a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2500); }

/* librerías externas: solo desde cdnjs (la CSP no admite otros orígenes) */
const LIB = {
  mammoth: 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js',
  jszip: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
  pdf: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfw: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  docx: 'https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.umd.min.js'
};
function cargaLib(urls) {
  return urls.reduce((p, u) => p.catch(() => new Promise((ok, ko) => { const s = document.createElement('script'); s.src = u; s.onload = ok; s.onerror = () => { s.remove(); ko(); }; document.head.appendChild(s); })), Promise.reject())
    .catch(() => { throw new Error('No se pudo cargar una librería: ¿hay conexión?'); });
}

/* huella SHA-256 (con alternativa para file:// sin contexto seguro) y canonización estable */
const canon = v => v === null || typeof v !== 'object' ? JSON.stringify(v) : Array.isArray(v) ? '[' + v.map(canon).join(',') + ']' : '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
function sha256js(bytes) {
  const pr = []; for (let n = 2; pr.length < 64; n++) if (pr.every(p => n % p)) pr.push(n);
  const fr = x => Math.floor((x - Math.floor(x)) * 4294967296), K = pr.map(p => fr(Math.cbrt(p))), H = pr.slice(0, 8).map(p => fr(Math.sqrt(p)));
  const l = bytes.length, pad = new Uint8Array(((l + 9 + 63) >> 6) << 6); pad.set(bytes); pad[l] = 0x80;
  const dv = new DataView(pad.buffer); dv.setUint32(pad.length - 8, Math.floor(l * 8 / 4294967296)); dv.setUint32(pad.length - 4, (l * 8) >>> 0);
  const rr = (x, n) => (x >>> n) | (x << (32 - n)), W = new Uint32Array(64);
  for (let i = 0; i < pad.length; i += 64) {
    for (let t = 0; t < 16; t++) W[t] = dv.getUint32(i + t * 4);
    for (let t = 16; t < 64; t++) { const s0 = rr(W[t - 15], 7) ^ rr(W[t - 15], 18) ^ (W[t - 15] >>> 3), s1 = rr(W[t - 2], 17) ^ rr(W[t - 2], 19) ^ (W[t - 2] >>> 10); W[t] = (W[t - 16] + s0 + W[t - 7] + s1) >>> 0; }
    let [a, b, c, d, e, f, g, hh] = H;
    for (let t = 0; t < 64; t++) { const S1 = rr(e, 6) ^ rr(e, 11) ^ rr(e, 25), ch = (e & f) ^ (~e & g), t1 = (hh + S1 + ch + K[t] + W[t]) >>> 0, S0 = rr(a, 2) ^ rr(a, 13) ^ rr(a, 22), mj = (a & b) ^ (a & c) ^ (b & c), t2 = (S0 + mj) >>> 0; hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0; }
    [a, b, c, d, e, f, g, hh].forEach((v, j) => H[j] = (H[j] + v) >>> 0);
  }
  return H.map(v => v.toString(16).padStart(8, '0')).join('');
}
async function sha256(str) {
  const b = new TextEncoder().encode(str);
  if (window.crypto?.subtle) { try { return [...new Uint8Array(await crypto.subtle.digest('SHA-256', b))].map(x => x.toString(16).padStart(2, '0')).join(''); } catch {} }
  return sha256js(b);
}

/* ── persistencia local (IndexedDB). La app define:  let S = {...};  y opcionalmente  const KEYP = () => 'main';  ── */
const dbP = new Promise((ok, ko) => { const r = indexedDB.open(APP, 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
const kv = async (mode, fn) => { const d = await dbP; return new Promise((ok, ko) => { const tx = d.transaction('kv', mode), q = fn(tx.objectStore('kv')); tx.oncomplete = () => ok(q && q.result); tx.onerror = () => ko(tx.error); }); };
const _key = () => (typeof KEYP === 'function' ? KEYP() : 'main');
let _g;
function guarda() { clearTimeout(_g); _g = setTimeout(() => kv('readwrite', s => s.put(S, _key())).catch(() => toast('No se pudo guardar en el navegador (¿demasiado material?)')), 500); }
/* guardado inmediato: úsalo justo después de pagar una llamada a la IA, para no perder el resultado si se cierra la pestaña */
const guardaYa = () => { clearTimeout(_g); return kv('readwrite', s => s.put(S, _key())).catch(() => toast('No se pudo guardar en el navegador')); };
window.addEventListener('pagehide', () => { clearTimeout(_g); try { kv('readwrite', s => s.put(S, _key())); } catch {} });
async function cargaEstado(key = _key()) { try { const p = await kv('readonly', s => s.get(key)); return p || null; } catch { return null; } }

/* ── proveedores de IA con la clave de cada persona: OpenAI, Google Gemini, Anthropic Claude ──────────────
   Mensajes: [{role:'system'|'user'|'assistant', content: string | [{t:'text',v}, {t:'img',mime,data:'data:...'}]}]
   Uso:   const texto = await llm(msgs, {max: 2800});      const obj = await llmJSON(msgs, {max: 3500});
   Las claves viven solo en localStorage de este navegador. La clave de OpenAI es compartida por todo el catálogo ('ia_openai_key'). */
const PROV = {
  openai: {n: 'OpenAI', m: 'gpt-6-luna', k: 'ia_openai_key'},
  gemini: {n: 'Google Gemini', m: 'gemini-2.5-flash', k: APP + '_key_gemini'},
  anthropic: {n: 'Anthropic Claude', m: 'claude-haiku-4-5-20251001', k: APP + '_key_anthropic'}
};
const getProv = () => PROV[localStorage.getItem(APP + '_prov')] ? localStorage.getItem(APP + '_prov') : 'openai';
const getKey = (p = getProv()) => localStorage.getItem(PROV[p].k) || '';
const getMod = (p = getProv()) => localStorage.getItem(APP + '_model_' + p) || PROV[p].m;
const parseJ = tx => { tx = String(tx || '').trim().replace(/^```(?:json)?|```$/g, '').trim(); try { return JSON.parse(tx); } catch { const m = tx.match(/\{[\s\S]*\}/); if (m) try { return JSON.parse(m[0]); } catch {} } return null; };
const partes = c => typeof c === 'string' ? [{t: 'text', v: c}] : c;
function agrupa(msgs, rolA) { const o = []; for (const m of msgs.filter(m => m.role !== 'system')) { const r = m.role === 'assistant' ? rolA : 'user'; if (o.length && o.at(-1).role === r) o.at(-1).parts.push({t: 'text', v: '\n\n'}, ...partes(m.content)); else o.push({role: r, parts: [...partes(m.content)]}); } if (o.length && o[0].role !== 'user') o.unshift({role: 'user', parts: [{t: 'text', v: '.'}]}); return o; }
const sysDe = msgs => msgs.filter(m => m.role === 'system').map(m => typeof m.content === 'string' ? m.content : m.content.map(p => p.v || '').join('')).join('\n\n');
function httpErr(st, tx, pv, mod) {
  if (st === 401 || st === 403 || (pv === 'gemini' && st === 400 && /API key|API_KEY/i.test(tx))) return new Error(`${PROV[pv].n} no reconoce tu clave. Revísala en Configuración.`);
  if (st === 404 || /model_not_found|not found|does not exist/i.test(tx)) return new Error(`Tu clave no tiene acceso al modelo «${mod}». Elige otro en Configuración.`);
  if (st === 429 && /quota|billing|credit|RESOURCE_EXHAUSTED/i.test(tx)) return new Error(`Tu cuenta de ${PROV[pv].n} no tiene saldo o ha alcanzado su límite.`);
  if (st === 400 && /image|vision|multimodal|modalit/i.test(tx)) return new Error(`El modelo «${mod}» no admite imágenes. Elige uno con visión.`);
  return new Error(`${PROV[pv].n} ${st}: ${String(tx).slice(0, 180)}`);
}
async function conReintentos(fn, pv) {
  for (let k = 0; k < 5; k++) {
    let r; try { r = await fn(); } catch { if (k >= 2) throw new Error(`No hay conexión con ${PROV[pv].n}.`); await sleep(1500); continue; }
    if (r.ok) return r;
    if (r.status === 429 || r.status >= 500) { const tx = await r.clone().text(); if (r.status === 429 && /quota|billing|credit/i.test(tx)) return r; await sleep(2 ** (k + 1) * 1000); continue; }
    return r;
  }
  throw new Error(`${PROV[pv].n} no responde ahora mismo. Inténtalo de nuevo en un momento.`);
}
async function llm(msgs, {json = false, max = 2800, pv: pvO, mod: modO, temp = 0.4} = {}) {
  const pv = pvO || getProv(), key = getKey(pv), mod = modO || getMod(pv);
  if (!key) throw new Error('Falta tu clave de IA. Pégala en Configuración.');
  if (pv === 'openai') {
    /* los modelos nuevos rechazan max_tokens/temperature: se prueban variantes según el error */
    const razona = /^(gpt-[56]|o\d)/.test(mod), o = {json, reasoning: razona, comp: razona, temp: !razona};
    const mm = msgs.map(m => ({role: m.role, content: typeof m.content === 'string' ? m.content : m.content.map(p => p.t === 'text' ? {type: 'text', text: p.v} : {type: 'image_url', image_url: {url: p.data}})}));
    for (let k = 0; k < 6; k++) {
      const body = {model: mod, messages: mm};
      if (o.json) body.response_format = {type: 'json_object'};
      if (o.comp) body.max_completion_tokens = max * (o.reasoning ? 2 : 1); else body.max_tokens = max;
      if (o.reasoning) body.reasoning_effort = 'low';
      if (o.temp) body.temperature = temp;
      const r = await conReintentos(() => fetch('https://api.openai.com/v1/chat/completions', {method: 'POST', headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + key}, body: JSON.stringify(body)}), pv);
      if (r.ok) return (await r.json()).choices?.[0]?.message?.content || '';
      const tx = await r.text();
      if (r.status === 400) {
        if (/reasoning_effort/i.test(tx) && o.reasoning) { o.reasoning = false; continue; }
        if (/max_completion_tokens/i.test(tx) && o.comp) { o.comp = false; continue; }
        if (/max_tokens/i.test(tx) && !o.comp) { o.comp = true; continue; }
        if (/temperature/i.test(tx) && o.temp) { o.temp = false; continue; }
        if (/response_format|json/i.test(tx) && o.json) { o.json = false; const u = mm.at(-1); if (typeof u.content === 'string') u.content += '\nResponde SOLO con JSON válido.'; else u.content.push({type: 'text', text: 'Responde SOLO con JSON válido.'}); continue; }
      }
      throw httpErr(r.status, tx, pv, mod);
    }
    throw new Error('OpenAI no responde ahora mismo.');
  }
  if (pv === 'gemini') {
    const sys = sysDe(msgs), cont = agrupa(msgs, 'model').map(m => ({role: m.role, parts: m.parts.map(p => p.t === 'text' ? {text: p.v} : {inline_data: {mime_type: p.mime, data: p.data.split(',')[1]}})}));
    const body = {contents: cont, generationConfig: {maxOutputTokens: max, temperature: temp}};
    if (sys) body.systemInstruction = {parts: [{text: sys}]};
    if (json) body.generationConfig.responseMimeType = 'application/json';
    const r = await conReintentos(() => fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(mod)}:generateContent`, {method: 'POST', headers: {'Content-Type': 'application/json', 'x-goog-api-key': key}, body: JSON.stringify(body)}), pv);
    const tx = await r.text(); if (!r.ok) throw httpErr(r.status, tx, pv, mod);
    const j = JSON.parse(tx), txt = (j.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
    if (!txt && j.promptFeedback?.blockReason) throw new Error(`El proveedor ha bloqueado la respuesta (${j.promptFeedback.blockReason}).`);
    return txt;
  }
  const sys = sysDe(msgs), mm = agrupa(msgs, 'assistant').map(m => ({role: m.role, content: m.parts.map(p => p.t === 'text' ? {type: 'text', text: p.v} : {type: 'image', source: {type: 'base64', media_type: p.mime, data: p.data.split(',')[1]}})}));
  if (json) mm.at(-1).content.push({type: 'text', text: '\n\nResponde SOLO con un objeto JSON válido, sin texto alrededor.'});
  const r = await conReintentos(() => fetch('https://api.anthropic.com/v1/messages', {method: 'POST', headers: {'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'}, body: JSON.stringify({model: mod, max_tokens: max, system: sys, messages: mm})}), pv);
  const tx = await r.text(); if (!r.ok) throw httpErr(r.status, tx, pv, mod);
  return (JSON.parse(tx).content || []).filter(b => b.type === 'text').map(b => b.text).join('');
}
async function llmJSON(msgs, o = {}) { for (let k = 0; k < 2; k++) { const j = parseJ(await llm(msgs, {...o, json: true})); if (j && typeof j === 'object') return j; } throw new Error('La IA no devolvió una respuesta con el formato esperado. Inténtalo de nuevo.'); }
async function listaModelos(pv = getProv()) {
  const key = getKey(pv); if (!key) throw new Error('Primero pega tu clave.'); let r;
  try {
    if (pv === 'openai') r = await fetch('https://api.openai.com/v1/models', {headers: {Authorization: 'Bearer ' + key}});
    else if (pv === 'gemini') r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=100', {headers: {'x-goog-api-key': key}});
    else r = await fetch('https://api.anthropic.com/v1/models?limit=100', {headers: {'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'}});
  } catch { throw new Error(`No hay conexión con ${PROV[pv].n}.`); }
  const tx = await r.text(); if (!r.ok) throw httpErr(r.status, tx, pv, ''); const j = JSON.parse(tx);
  if (pv === 'openai') return (j.data || []).map(m => m.id).filter(id => /^(gpt-|o\d|chatgpt-)/.test(id) && !/(audio|realtime|transcribe|tts|image|embedding|moderation|search|instruct|whisper|dall|davinci|babbage|codex|computer-use)/i.test(id)).sort();
  if (pv === 'gemini') return (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent')).map(m => m.name.replace(/^models\//, '')).sort();
  return (j.data || []).map(m => m.id).sort();
}

/* ── verificación por código de lo que dice la IA, anonimización y Markdown seguro ──────────────────────────
   Principio: la IA propone, el código comprueba. Nunca muestres como hecho una cita, una cifra o un recuento
   que la IA afirme sin haberlo contrastado con el texto de origen. */

/* texto normalizado con mapa a las posiciones originales */
function normMap(s) {
  let n = ''; const map = []; let sp = true;
  for (let i = 0; i < s.length; i++) {
    const c = s[i].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    if (/[\p{L}\p{N}]/u.test(c)) { for (const ch of c) { n += ch; map.push(i); } sp = false; }
    else if (!sp) { n += ' '; map.push(i); sp = true; }
  }
  return {n, map};
}
let _nm = null;
const nmat = mat => { if (!_nm || _nm.src !== mat) _nm = {src: mat, ...normMap(mat)}; return _nm; };
/* ¿aparece la cita (literal, ignorando mayúsculas, tildes y puntuación) en el material? */
function localiza(mat, cita, minLen = 12) { const q = norm(cita); if (q.length < minLen) return null; const m = nmat(mat), i = m.n.indexOf(q); return i < 0 ? null : [m.map[i], m.map[Math.min(i + q.length - 1, m.map.length - 1)]]; }
const esFiel = (mat, cita) => !!localiza(mat, cita);
/* extractos del material alrededor de las citas (para dar contexto sin enviar todo) */
function ventanas(mat, citas, rad = 700, tope = 4200) {
  const r = citas.map(c => localiza(mat, c)).filter(Boolean).map(([a, b]) => [Math.max(0, a - rad), Math.min(mat.length, b + rad)]).sort((x, y) => x[0] - y[0]), m = [];
  for (const v of r) { const l = m.at(-1); if (l && v[0] <= l[1]) l[1] = Math.max(l[1], v[1]); else m.push([...v]); }
  const t = m.map(([a, b]) => mat.slice(a, b).trim()).join('\n[…]\n'); return t.length > tope ? t.slice(0, tope) : t;
}
/* cifras que la IA menciona y no están en el material (ignora números pequeños) */
const numsDe = t => new Set((String(t).match(/\d+(?:[.,]\d+)?/g) || []).map(x => x.replace(',', '.')));
function numerosNuevos(texto, mat) { const m = numsDe(mat); return [...numsDe(texto)].filter(x => !m.has(x) && parseFloat(x) > 12); }

/* datos personales: se enmascaran antes de enviar nada a un proveedor externo */
const PII = [['CORREO', /[\w.+-]+@[\w-]+\.[\w.-]+/g], ['ID', /\b\d{8}[A-HJ-NP-TV-Z]\b|\b[XYZ]\d{7}[A-Z]\b/gi], ['TELÉFONO', /(?:\+\d{2}\s?)?\b[6-9]\d{2}[\s.-]?\d{3}[\s.-]?\d{3}\b/g]];
function scrub(txt, nombre = '') {
  let n = 0, t = String(txt ?? ''); PII.forEach(([tag, rx]) => { t = t.replace(rx, () => { n++; return `[${tag}]`; }); });
  const nm = new Set(norm(nombre).split(' ').filter(w => w.length >= 3));

/* Markdown mínimo y seguro (escapa antes de formatear) */
function md(s) {
  const inl = x => esc(x).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<i>$2</i>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const out = []; let lst = null; const cierra = () => { if (lst) { out.push(`</${lst}>`); lst = null; } };
  for (const raw of String(s || '').split('\n')) {
    const l = raw.trimEnd(); let m; if (!l.trim()) { cierra(); continue; }
    if (m = l.match(/^#{1,4}\s+(.*)/)) { cierra(); out.push(`<h4>${inl(m[1])}</h4>`); continue; }
    if (m = l.match(/^\s*[-*•]\s+(.*)/)) { if (lst !== 'ul') { cierra(); out.push('<ul>'); lst = 'ul'; } out.push(`<li>${inl(m[1])}</li>`); continue; }
    if (m = l.match(/^\s*\d+[.)]\s+(.*)/)) { if (lst !== 'ol') { cierra(); out.push('<ol>'); lst = 'ol'; } out.push(`<li>${inl(m[1])}</li>`); continue; }
    cierra(); out.push(`<p>${inl(l)}</p>`);
  }
  cierra(); return out.join('');
}

/* ── lectura de ficheros del usuario, todo en el navegador ───────────────────────────────────────────────
   extrae(file) → {tipo:'texto'|'img'|'av', nombre, texto, imgs:[{nombre,data}], incr, aviso?, file?}
   Admite TXT/MD/CSV/SRT, DOCX (texto + imágenes incrustadas), PPTX (texto + notas del ponente + imágenes),
   PDF (texto; si no tiene texto, las primeras páginas como imágenes) e imágenes. Audio/vídeo se devuelven con tipo 'av'
   para transcribirlos aparte (ver 50-transcribe.js). */
const xmlDec = s => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');
const pptxPars = xml => xml.split('</a:p>').map(p => [...p.matchAll(/<a:t[^>]*>([^<]*)<\/a:t>/g)].map(m => xmlDec(m[1])).join('')).map(s => s.trim()).filter(Boolean);
const MAXIMG = 8;
const MIMEIMG = {png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp'};
function reduceImg(src, max = 1280) { return new Promise((ok, ko) => { const im = new Image(); im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k)); const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', .82)); }; im.onerror = () => ko(new Error('No se pudo leer una imagen')); im.src = src; }); }
const dataUrl = blob => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(blob); });
async function extrae(file) {
  const ext = file.name.split('.').pop().toLowerCase(), n = file.name;
  if (['txt', 'md', 'markdown', 'csv', 'srt', 'vtt'].includes(ext)) return {tipo: 'texto', nombre: n, texto: await file.text(), imgs: [], incr: 0};
  if (MIMEIMG[ext] || /^image\//.test(file.type)) return {tipo: 'img', nombre: n, texto: '', imgs: [{nombre: n, data: await reduceImg(await dataUrl(file))}], incr: 0};
  if (/^(audio|video)\//.test(file.type) || /\.(mp3|wav|m4a|ogg|oga|flac|mp4|mov|webm|mkv|aac|mpga)$/i.test(n)) return {tipo: 'av', nombre: n, texto: '', imgs: [], incr: 0, file};
  if (ext === 'docx') {
    await cargaLib([LIB.mammoth]); const ab = await file.arrayBuffer(), imgs = []; let incr = 0;
    await mammoth.convertToHtml({arrayBuffer: ab}, {convertImage: mammoth.images.imgElement(async im => { incr++; if (imgs.length < MAXIMG) { try { imgs.push({nombre: `${n} · imagen ${incr}`, data: await reduceImg(`data:${im.contentType};base64,${await im.read('base64')}`)}); } catch {} } return {src: ''}; })});
    return {tipo: 'texto', nombre: n, texto: (await mammoth.extractRawText({arrayBuffer: ab})).value, imgs, incr};
  }
  if (ext === 'pptx') {
    await cargaLib([LIB.jszip]); const z = await JSZip.loadAsync(await file.arrayBuffer()), num = f => +f.match(/(\d+)\.xml$/)[1];
    const sl = Object.keys(z.files).filter(f => /^ppt\/slides\/slide\d+\.xml$/.test(f)).sort((a, b) => num(a) - num(b)); if (!sl.length) throw new Error('El PowerPoint no tiene diapositivas');
    const out = [];
    for (const f of sl) {
      const txt = pptxPars(await z.file(f).async('string')); let notas = [];
      const rel = z.file(f.replace('slides/', 'slides/_rels/') + '.rels');
      if (rel) { const m = (await rel.async('string')).match(/Target="\.\.\/notesSlides\/(notesSlide\d+\.xml)"/); if (m && z.file('ppt/notesSlides/' + m[1])) notas = pptxPars(await z.file('ppt/notesSlides/' + m[1]).async('string')).filter(x => !/^\d+$/.test(x)); }
      out.push(`## Diapositiva ${num(f)}\n${txt.join('\n')}${notas.length ? '\n[Notas del ponente] ' + notas.join(' ') : ''}`);
    }
    const med = Object.keys(z.files).filter(f => /^ppt\/media\/.+\.(png|jpe?g|gif|webp)$/i.test(f)), imgs = [];
    for (const f of med.slice(0, MAXIMG)) { try { const b = await z.file(f).async('blob'); imgs.push({nombre: `${n} · ${f.split('/').pop()}`, data: await reduceImg(await dataUrl(new Blob([b], {type: MIMEIMG[f.split('.').pop().toLowerCase()] || 'image/png'})))}); } catch {} }
    return {tipo: 'texto', nombre: n, texto: out.join('\n\n'), imgs, incr: med.length};
  }
  if (ext === 'pdf') {
    await cargaLib([LIB.pdf]); pdfjsLib.GlobalWorkerOptions.workerSrc = LIB.pdfw;
    const doc = await pdfjsLib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise, pags = [];
    for (let i = 1; i <= doc.numPages; i++) { const c = await (await doc.getPage(i)).getTextContent(); let t = ''; c.items.forEach(it => { t += it.str + (it.hasEOL ? '\n' : ' '); }); pags.push(t.replace(/[ \t]+\n/g, '\n').trim()); }
    const t = pags.join('\n\n');
    if (t.replace(/\s/g, '').length < 80) { const imgs = []; for (let i = 1; i <= Math.min(doc.numPages, 6); i++) { const pg = await doc.getPage(i), vp = pg.getViewport({scale: 1.4}), c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; await pg.render({canvasContext: c.getContext('2d'), viewport: vp}).promise; imgs.push({nombre: `${n} · página ${i}`, data: await reduceImg(c.toDataURL('image/jpeg', .85))}); } return {tipo: 'texto', nombre: n, texto: '', imgs, incr: 0, aviso: 'PDF sin texto: se envían las primeras páginas como imágenes.'}; }
    return {tipo: 'texto', nombre: n, texto: t, imgs: [], incr: 0, aviso: 'En los PDF no se detectan las imágenes incrustadas.'};
  }
  throw new Error('Formato no admitido (usa Word, PDF, PowerPoint, texto, imágenes, audio o vídeo)');
}

/* ── navegación Forja: barra superior, stepper, barra inferior, ventanas, ayuda y ajustes de IA ─────────────
   La app define (en app.js; se leen al ejecutar, no al cargar el módulo) y llama a iniciaUI() al arrancar:
     const STEPS  = ['Inicio', 'Paso 1', ...];                   // etiquetas del stepper (la actual se muestra con nombre)

                const HUBS = ['Glosario', 'Progreso'];  // secciones fuera del recorrido lineal: pantallas con data-step = STEPS.length + k.

let step = 0;

/* wordDeMarkdown(md, {titulo, subtitulo, pie, kicker}) → Blob .docx
   Convierte ## encabezados, listas y **negritas**; lo demás va como párrafos. */
async function wordDeMarkdown(md, {titulo = '', subtitulo = '', pie = '', kicker = ''} = {}) {
  await cargaLib([LIB.docx]); const X = window.docx;
  const runs = (tx, base = {}) => String(tx).split(/(\*\*[^*]+\*\*)/).filter(Boolean).map(p => p.startsWith('**') ? new X.TextRun({text: p.slice(2, -2), font: 'Arial', size: 22, bold: true, ...base}) : new X.TextRun({text: p, font: 'Arial', size: 22, ...base}));
  const P = (tx, o = {}) => new X.Paragraph({heading: o.h, alignment: o.c ? X.AlignmentType.CENTER : undefined, spacing: {after: o.after ?? 110}, indent: o.ind ? {left: o.ind} : undefined, children: o.plain ? [new X.TextRun({text: String(tx), font: 'Arial', size: o.s || 22, bold: o.b, italics: o.i, color: o.col})] : runs(tx, {italics: o.i, color: o.col})});
  const k = [];
  if (kicker) k.push(P(kicker.toUpperCase(), {c: true, b: true, col: 'E4572E', s: 20, plain: true}));
  if (titulo) k.push(P(titulo, {c: true, b: true, s: 32, plain: true}));
  if (subtitulo) k.push(P(subtitulo, {c: true, col: '5D7691', s: 20, after: 260, plain: true}));
  for (const l of String(md).split('\n')) {
    const t = l.trimEnd(); if (!t.trim()) continue; let m;
    if (m = t.match(/^#{1,4}\s+(.*)/)) k.push(P(m[1].replace(/\*\*/g, ''), {h: X.HeadingLevel.HEADING_1, plain: true}));
    else if (m = t.match(/^\s*[-*•]\s+(.*)/)) k.push(P('•  ' + m[1], {ind: 360, after: 60}));
    else if (m = t.match(/^\s*(\d+[.)])\s+(.*)/)) k.push(P(m[1] + '  ' + m[2], {ind: 360, after: 60}));
    else k.push(P(t));
  }
  if (pie) k.push(P(pie, {i: true, s: 16, col: '8899AA', plain: true}));
  return X.Packer.toBlob(new X.Document({creator: typeof APP_NAME === 'string' ? APP_NAME : APP, sections: [{children: k}]}));
}

"mt.2": [

"Title and abstract screening was done independently and blinded by two automated reviewers based on language models from different providers. Roles and models: {0}. Disagreements ({1}) were settled by the third model acting as arbitrator, who assessed the record against the criteria and saw both reviewers’ reasoning anonymised and in random order. In case of doubt the record was included.",

/* ══ Núcleo de PRISMIA: lógica pura, sin DOM ni red (se prueba en Node con vm). Aquí viven las reglas que el código
      aplica por encima de lo que diga la IA: acuerdo, kappa, contadores PRISMA, juicio global de sesgo, comprobación de citas. ══ */
const cleanDoi = d => String(d || '').trim().replace(/^https?:\/\/(dx\.)?doi\.org\//i, '').replace(/^doi:\s*/i, '').replace(/[\s.,;]+$/, '').toLowerCase();
const REASON_CODES = ['population', 'intervention', 'comparator', 'outcome', 'design', 'language', 'publication_type', 'other'];

function parseRIS(txt) {
  const out = []; let cur = null;
  for (const raw of String(txt).split(/\r?\n/)) {
    const m = raw.match(/^([A-Z][A-Z0-9])  -\s?(.*)$/); if (!m) continue;
    const tag = m[1], v = m[2].trim();
    if (tag === 'TY') { cur = {authors: [], title: '', abstract: '', journal: '', year: '', doi: '', pmid: ''}; continue; }
    if (!cur) continue;
    if (tag === 'ER') { out.push(cur); cur = null; continue; }
    if (tag === 'TI' || (tag === 'T1' && !cur.title)) cur.title = v;
    else if (tag === 'AB' || tag === 'N2') cur.abstract += (cur.abstract ? ' ' : '') + v;
    else if (tag === 'AU' || tag === 'A1') cur.authors.push(v);
    else if (tag === 'PY' || tag === 'Y1' || tag === 'DA') { const y = v.match(/\d{4}/); if (y && !cur.year) cur.year = y[0]; }
    else if (tag === 'JO' || tag === 'JF' || tag === 'T2') cur.journal = cur.journal || v;
    else if (tag === 'DO') cur.doi = cleanDoi(v);
    else if ((tag === 'AN' || tag === 'ID') && /^\d{5,9}$/.test(v)) cur.pmid = cur.pmid || v;
  }
  return out;
}
function parseCSV(txt) {

  const d = cnt('\t') > cnt(',') && cnt('\t') >= cnt(';') ? '\t' : cnt(';') > cnt(',') ? ';' : ',';
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (q) { if (c === '"') { if (txt[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === d) { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && txt[i + 1] === '\n') i++; row.push(f); f = ''; if (row.length > 1 || row[0] !== '') rows.push(row); row = []; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  if (rows.length < 2) return [];
  const H = rows[0].map(h => h.trim().toLowerCase()), col = (...ns) => { for (const n of ns) { const i = H.indexOf(n); if (i >= 0) return i; } return -1; };
  const ci = {title: col('title', 'article title', 'ti', 'document title'), abs: col('abstract', 'ab'), doi: col('doi', 'di'), year: col('year', 'publication year', 'py', 'pubyear'),
    au: col('authors', 'author full names', 'au', 'author'), jo: col('source title', 'journal', 'so', 'journal/book', 'publication title'), pm: col('pubmed id', 'pmid', 'pm')};
  if (ci.title < 0) return [];
  const g = (r, i) => i >= 0 ? (r[i] || '').trim() : '';
  return rows.slice(1).map(r => ({title: g(r, ci.title), abstract: g(r, ci.abs), doi: cleanDoi(g(r, ci.doi)), year: (g(r, ci.year).match(/\d{4}/) || [''])[0],
    authors: g(r, ci.au).split(/;\s*/).filter(Boolean), journal: g(r, ci.jo), pmid: g(r, ci.pm)})).filter(r => r.title);
}
/* duplicados por DOI, PMID o título normalizado; el registro que se conserva hereda lo que le falte */
function dedupeRecs(recs) {
  const mDoi = new Map(), mPm = new Map(), mT = new Map(); let n = 0;
  for (const r of recs) {
    r.dup = false; delete r.dupOf;
    const tk = norm(r.title) + '|' + (r.year || '');
    const o = (r.doi && mDoi.get(r.doi)) || (r.pmid && mPm.get(r.pmid)) || (norm(r.title).length > 20 && mT.get(tk)) || null;
    if (o) { r.dup = true; r.dupOf = o.id; n++; for (const k of ['abstract', 'doi', 'pmid', 'oaUrl']) if (!o[k] && r[k]) o[k] = r[k]; }
    else { if (r.doi) mDoi.set(r.doi, r); if (r.pmid) mPm.set(r.pmid, r); mT.set(tk, r); }

function parsePICO(t) {
  t = String(t || '').trim(); let o = null; try { o = JSON.parse(t); } catch { const m = t.match(/\{[\s\S]*\}/); if (m) try { o = JSON.parse(m[0]); } catch {} }
  const g = (...ks) => { if (!o) return ''; for (const k of ks) { const e = Object.entries(o).find(([a]) => a.toLowerCase() === k); if (e) return String(e[1]); } return ''; };
  if (o) return {p: g('p', 'population', 'poblacion', 'población'), i: g('i', 'intervention', 'intervencion', 'intervención', 'exposure', 'e'), c: g('c', 'comparator', 'comparison', 'comparador'), o: g('o', 'outcome', 'outcomes', 'resultado'), s: g('s', 'design', 'study_design', 'diseño')};

}

/* ── acuerdo entre revisores ── */
function cohen(a, b) {
  const n = a.length; if (!n) return null; let ag = 0, a1 = 0, b1 = 0;
  for (let i = 0; i < n; i++) { if (a[i] === b[i]) ag++; a1 += a[i]; b1 += b[i]; }
  const po = ag / n, pe = (a1 / n) * (b1 / n) + (1 - a1 / n) * (1 - b1 / n);
  return {n, po, k: pe === 1 ? 1 : (po - pe) / (1 - pe), pabak: 2 * po - 1};
}
const kLabelKey = k => k < 0 ? 'k.neg' : k <= .2 ? 'k.sl' : k <= .4 ? 'k.fa' : k <= .6 ? 'k.mo' : k <= .8 ? 'k.su' : 'k.al';
const pasa = d => d && d.decision !== 'exclude';
/* sale 1 si el revisor deja pasar el registro (incluir o «quizá») y 0 si lo excluye */
function kappaDe(recs, stage) {
  const rows = recs.filter(r => !r.dup && r[stage]?.r1 && r[stage]?.r2);
  if (!rows.length) return null;
  const k = cohen(rows.map(r => pasa(r[stage].r1) ? 1 : 0), rows.map(r => pasa(r[stage].r2) ? 1 : 0));
  return {...k, arbitrados: rows.filter(r => r[stage].by === 'árbitro').length};
}
function critOutcome(j, permiteQuiza) {
  const d = String(j?.decision || '').toLowerCase();
  const decision = d === 'include' ? 'include' : d === 'exclude' ? 'exclude' : (permiteQuiza && d === 'maybe' ? 'maybe' : 'include');   /* ante la duda, incluir */
  const rc = REASON_CODES.includes(j?.reason_code) ? j.reason_code : 'other';
  return {decision, reason: decision === 'exclude' ? rc : 'none', why: String(j?.rationale || '').slice(0, 300)};
}
/* resuelve la decisión final: si los dos revisores coinciden en pasar/no pasar, decide el acuerdo; si no, el árbitro */
function resuelveCribado(slot, juez) {
  if (pasa(slot.r1) === pasa(slot.r2)) { slot.final = pasa(slot.r1) ? 'include' : 'exclude'; slot.by = 'acuerdo'; slot.reason = slot.final === 'exclude' ? slot.r1.reason : 'none'; delete slot.judge; return false; }
  if (!juez) return true;
  slot.judge = juez; slot.final = juez.decision === 'exclude' ? 'exclude' : 'include'; slot.by = 'árbitro'; slot.reason = slot.final === 'exclude' ? juez.reason : 'none'; return false;
}

/* ── contadores del diagrama PRISMA 2020 ── */
function prismaCounts(recs) {
  const c = {bySource: {}, identified: recs.length, dup: 0, screened: 0, exTA: 0, sought: 0, notRet: 0, assessed: 0, exFT: 0, exFTreasons: {}, included: 0};
  for (const r of recs) {
    c.bySource[r.source] = (c.bySource[r.source] || 0) + 1;
    if (r.dup) { c.dup++; continue; }
    c.screened++;
    if (r.ta?.final === 'exclude') c.exTA++;
    if (r.ta?.final === 'include') {
      c.sought++;
      if (r.ft?.status === 'missing') c.notRet++;
      if (r.ft?.status === 'retrieved') {
        c.assessed++;
        if (r.ft.final === 'exclude') { c.exFT++; const k = r.ft.reason || 'other'; c.exFTreasons[k] = (c.exFTreasons[k] || 0) + 1; }
        if (r.ft.final === 'include') c.included++;
      }
    }
  }
  return c;
}

/* ── extracción: comparación, citas y cifras ── */
function sameVal(a, b) {
  const x = norm(a), y = norm(b); if (x === y) return true;
  const num = /^[\d.,\s%]+$/, nx = parseFloat(String(a).replace(',', '.')), ny = parseFloat(String(b).replace(',', '.'));
  if (num.test(String(a).trim()) && num.test(String(b).trim()) && !isNaN(nx) && !isNaN(ny)) return Math.abs(nx - ny) <= 1e-9 * Math.max(1, Math.abs(nx));
  const A = new Set(x.split(' ')), B = new Set(y.split(' ')); if (!A.size || !B.size) return false;
  let i = 0; A.forEach(w => { if (B.has(w)) i++; });
  const mn = Math.min(A.size, B.size); if (mn >= 2 && i === mn) return true;
  return i / (A.size + B.size - i) >= .8;
}
/* la IA propone un valor y una cita; el código comprueba que la cita está en el texto y que las cifras del valor también */
function verificaCampo(valor, cita, texto) {
  if (String(valor).trim().toUpperCase() === 'NR' || !String(valor).trim()) return {citaOk: null, cifras: []};
  return {citaOk: esFiel(texto, cita), cifras: numerosNuevos(String(valor), texto)};
}
function conciliaExtraccion(A, B, tpl) {
  const out = {}, disputa = [];
  for (const f of tpl) {
    const x = A?.[f.key] || {value: 'NR', quote: ''}, y = B?.[f.key] || {value: 'NR', quote: ''};
    if (sameVal(x.value, y.value)) out[f.key] = {value: String(x.value), quote: String(x.quote || y.quote || ''), by: 'acuerdo'};
    else { disputa.push(f.key); out[f.key] = {value: '', quote: '', by: 'pendiente', a: x, b: y}; }
  }
  return {out, disputa};
}

function toolFromDesign(s) {

function robOverall(tool, doms) {

function prismaSVG(c) {
  const bx = (x, y, w, h, lines, fill) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${fill || '#fff'}" stroke="#0F2237" stroke-width="1.3"/>` + lines.map((tx, i) => `<text x="${x + 11}" y="${y + 23 + i * 17}" font-size="13.5" fill="#0F2237" ${i === 0 ? 'font-weight="700"' : ''}>${esc(tx)}</text>`).join('');
  const ar = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#0F2237" stroke-width="1.3" marker-end="url(#fa)"/>`;
  const L = 20, R = 450, W = 380;
  const src = Object.entries(c.bySource).map(([k, v]) => `${k}: ${v}`), why = Object.entries(c.exFTreasons).map(([k, v]) => `${rsn(k)}: ${v}`);
  const h1 = 34 + Math.max(1, src.length) * 17, h4 = Math.max(60, 34 + Math.max(1, why.length) * 17);
  let y = 16, s = '';
  s += bx(L, y, W, h1, [t('x.id', c.identified), ...src]) + bx(R, y, W, 60, [t('x.dup'), 'n = ' + c.dup]) + ar(L + W / 2, y + h1, L + W / 2, y + h1 + 34) + ar(L + W, y + 30, R, y + 30); y += h1 + 34;
  s += bx(L, y, W, 60, [t('x.scr'), 'n = ' + c.screened]) + bx(R, y, W, 60, [t('x.exta'), 'n = ' + c.exTA]) + ar(L + W / 2, y + 60, L + W / 2, y + 94) + ar(L + W, y + 30, R, y + 30); y += 94;
  s += bx(L, y, W, 60, [t('x.sought'), 'n = ' + c.sought]) + bx(R, y, W, 60, [t('x.notret'), 'n = ' + c.notRet]) + ar(L + W / 2, y + 60, L + W / 2, y + 94) + ar(L + W, y + 30, R, y + 30); y += 94;
  s += bx(L, y, W, 60, [t('x.assess'), 'n = ' + c.assessed]) + bx(R, y, W, h4, [t('x.extf', c.exFT), ...(why.length ? why : ['—'])]) + ar(L + W, y + 30, R, y + 30);
  const yb = y + h4 + 34; s += ar(L + W / 2, y + 60, L + W / 2, yb) + bx(L, yb, W, 60, [t('x.incl'), 'n = ' + c.included], '#E0F3EE');
  const H = yb + 80, W2 = R + W + 20;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W2} ${H}" width="${W2}" height="${H}" role="img" aria-labelledby="pt pd"><title id="pt">${esc(t('x.svgt'))}</title><desc id="pd">${esc(t('x.svgd', c.identified, c.dup, c.screened, c.sought, c.included))}</desc><defs><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0F2237"/></marker></defs><rect width="100%" height="100%" fill="#fff"/>${s}</svg>`;
}

  const ex = S.records.filter(r => r.ext), rb = S.records.filter(r => r.rob?.overall);
  const f = {'registros.csv': csvDe(reg[0], reg.slice(1))};
  if (ex.length) f['extraccion.csv'] = csvDe(['id', 'titulo', ...S.tpl.flatMap(c => [c.key, c.key + '_cita', c.key + '_cita_verificada', c.key + '_cifras_no_halladas', c.key + '_decide'])], ex.map(r => [r.id, r.title, ...S.tpl.flatMap(c => { const x = r.ext.fields[c.key] || {}; return [x.value, x.quote, SI(x.verified), (x.cifras || []).join(' '), x.by]; })]));
  if (rb.length) f['riesgo_sesgo.csv'] = csvDe(['id', 'titulo', 'herramienta', 'dominio', 'juicio', 'cita', 'cita_verificada', 'razon', 'decide', 'global'], rb.flatMap(r => ROB[r.rob.tool].doms.map(([k, n]) => [r.id, r.title, ROB[r.rob.tool].name, n, r.rob.doms[k].j, r.rob.doms[k].quote, SI(r.rob.doms[k].verified), r.rob.doms[k].why, r.rob.doms[k].by, r.rob.overall])));
  f['uso_ia.csv'] = csvDe(['fase', 'rol', 'proveedor', 'modelo', 'llamadas'], Object.entries(S.uso || {}).map(([k, n]) => [...k.split('|'), n]));
  return f;
}
$('exCsv').onclick = async () => { try { dl('prismia_tablas.zip', await zipDe(tablasCSV())); } catch (e) { toast(e.message, 7000); } };
$('exWord').onclick = async () => {
  const c = prismaCounts(S.records), inc = S.records.filter(r => r.ft?.final === 'include');
  const md = `## ${t('x.meth')}\n${(S.methods || metodosTexto()).split('\n\n').join('\n')}\n\n## ${t('x.flow')}\n- ${t('x.id', c.identified)}\n- ${t('x.dup')}: ${c.dup}\n- ${t('x.scr')}: ${c.screened}\n- ${t('x.exta')}: ${c.exTA}\n- ${t('x.sought')}: ${c.sought}\n- ${t('x.notret')}: ${c.notRet}\n- ${t('x.assess')}: ${c.assessed}\n- ${t('x.extf', c.exFT)}${Object.entries(c.exFTreasons).map(([k, v]) => ' · ' + rsn(k) + ': ' + v).join('')}\n- ${t('x.incl')}: ${c.included}\n\n## ${t('x.incl')}\n${inc.map(r => `- ${r.title}${r.rob?.overall ? ' — ' + ROB[r.rob.tool].name + ': ' + (r.rob.tool === 'nos' ? r.rob.overall.split(':')[1] + ' ★' : robLab(r.rob.tool, r.rob.overall)) : ''}`).join('\n') || '-'}`;
  try { dl('prismia_informe.docx', await wordDeMarkdown(md, {titulo: 'PRISMIA', subtitulo: new Date().toLocaleDateString(), pie: t('x.wfoot')})); } catch (e) { toast(e.message, 7000); }
};
$('exProj').onclick = () => {
  const o = JSON.parse(JSON.stringify(S)); o.software = 'PRISMIA 1.0.0'; if ($('exTexts').checked) o.texts = TEXTS;
  dl('prismia_proyecto.json', JSON.stringify(o), 'application/json');
};
$('impProj').onchange = async e => {
  try {
    const o = JSON.parse(await e.target.files[0].text()); if (!proyectoValido(o)) throw new Error(t('x.badproj'));
    const tx = o.texts || {}; delete o.texts; S = {...nuevoEstado(), ...o, cfg: {...nuevoEstado().cfg, ...o.cfg}}; TEXTS = {};
    for (const [k, v] of Object.entries(tx)) await setText(k, v);
    await guardaYa(); pintaConfig(); renderAll(); toast(t('x.imported'));
  } catch (x) { toast(x.message, 8000); }
  e.target.value = '';
};
$('wipe').onclick = async () => {
  if (!confirm(t('x.wipec'))) return;
  try { await kv('readwrite', s => s.clear()); } catch {}
  S = nuevoEstado(); TEXTS = {}; ENVIO = {}; await guardaYa(); pintaConfig(); go(0); toast(t('x.wiped'));
};

/* ── idioma y barra de ejecución ── */
function renderAll() { (RENDER[step] || (() => {}))(); $('demoBar').hidden = !S.demo; }
function aplicaIdioma() {
  applyI18n(); refrescaTextos();
  $$('.pi-lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === LANG));
  $('glos').innerHTML = GLOS.map(g => `<div><b>${esc(g[0])}</b><span>${esc(g[1])}</span></div>`).join('');
  $('demoBar').textContent = t('demo.banner');
}
function setLang(l) { LANG = l; localStorage.setItem(APP + '_lang', l); aplicaIdioma(); go(step); }
$$('.pi-lang button').forEach(b => b.onclick = () => setLang(b.dataset.lang));
$('runStop').onclick = () => { STOP = true; progreso(t('prog.stopping')); };
document.addEventListener('click', e => {
  const r = e.target.closest('[data-run]'); if (r) ejecuta(r.dataset.run);
});
$('envioOk').onchange = () => { $('envioSi').disabled = !$('envioOk').checked; };
$('envioSi').onclick = () => cierraEnvio(true); $('envioNo').onclick = () => cierraEnvio(false);
window.addEventListener('beforeunload', e => { if (BUSY) { e.preventDefault(); e.returnValue = ''; } });

/* ── arranque ── */
(async () => {
  const demoBar = document.createElement('div'); demoBar.id = 'demoBar'; demoBar.className = 'aviso pi-demo'; demoBar.hidden = true; demoBar.setAttribute('role', 'note'); $('app').before(demoBar);
  const p = await cargaEstado(); if (p && proyectoValido(p)) S = {...nuevoEstado(), ...p, cfg: {...nuevoEstado().cfg, ...p.cfg}};
  await cargaTextos(); aplicaIdioma(); iniciaUI(); enlaza(); go(0);
})();
